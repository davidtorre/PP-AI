services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # DB is NOT exposed to the host — only reachable by backend inside the network
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

  # ── Backend API ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV:    production
      PORT:        3001
      # Database
      DB_HOST:     database
      DB_PORT:     5432
      DB_NAME:     ${DB_NAME}
      DB_USER:     ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # Auth
      JWT_SECRET:  ${JWT_SECRET}
      # Email (optional — leave blank to disable)
      ENABLE_EMAIL: ${ENABLE_EMAIL:-false}
      SMTP_HOST:    ${SMTP_HOST:-}
      SMTP_PORT:    ${SMTP_PORT:-587}
      SMTP_USER:    ${SMTP_USER:-}
      SMTP_PASS:    ${SMTP_PASS:-}
      SMTP_FROM:    ${SMTP_FROM:-}
      # Google OAuth (optional — leave blank to disable)
      GOOGLE_CLIENT_ID:     ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL:  ${GOOGLE_CALLBACK_URL:-}
      FRONTEND_URL:         ${FRONTEND_URL}
    volumes:
      - uploads:/app/uploads
    # Backend is NOT exposed to the host — only reachable by frontend nginx
    expose:
      - "3001"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - internal

  # ── Frontend (nginx) ──────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal

# ── Volumes ───────────────────────────────────────────────────────────────
volumes:
  pgdata:
  uploads:

# ── Networks ──────────────────────────────────────────────────────────────
# Single internal network — no service is reachable from outside except
# the frontend on FRONTEND_PORT. Database and backend have no host ports.
networks:
  internal:
    driver: bridge
